<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>About — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pt-6 pb-28">

    <!-- Header -->
    <div class="flex items-center gap-3">
      <a href="more.html" class="text-slate-900" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1 class="text-lg font-bold text-slate-900">About</h1>
    </div>

    <!-- App identity -->
    <div class="mt-10 flex flex-col items-center text-center">
      <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center">
        <img src="assets/logo.svg" alt="SoftLedger" class="w-11 h-11">
      </div>
      <h2 class="mt-4 text-xl font-bold text-slate-900">SoftLedger</h2>
      <p id="app-version" class="mt-1 text-sm text-slate-400">v1.0.0</p>
      <p class="mt-4 text-sm text-slate-500 leading-relaxed max-w-[15rem]">
        A smarter way to manage your charging business.
      </p>
    </div>

    <!-- Links -->
    <div class="mt-10 space-y-3">
      <button data-toast="Terms of Service coming soon"
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/>
          <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Terms of Service</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <button data-toast="Privacy Policy coming soon"
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Privacy Policy</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <button data-toast="App license coming soon"
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <circle cx="12" cy="12" r="10"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">App License</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Footer -->
    <p id="app-copyright" class="mt-10 text-center text-xs text-slate-400">© 2026 SoftLedger. All rights reserved.</p>

  </div>

  <!-- Bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100" style="padding-bottom:env(safe-area-inset-bottom,0px)">
    <div class="mx-auto lg:max-w-sm grid grid-cols-4">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
        </svg>
        <span class="text-[11px] font-medium">Home</span>
      </a>
      <a href="customers.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-[11px] font-medium">Customers</span>
      </a>
      <a href="transactions.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
        </svg>
        <span class="text-[11px] font-medium">Transactions</span>
      </a>
      <a href="more.html" class="flex flex-col items-center gap-1 py-2.5 text-blue-600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        </svg>
        <span class="text-[11px] font-medium">More</span>
      </a>
    </div>
  </nav>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { showToast } from "./js/utils.js";

  requireAuth();

  document.getElementById("app-copyright").textContent =
    `© ${new Date().getFullYear()} SoftLedger. All rights reserved.`;

  document.querySelectorAll("[data-toast]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showToast(el.dataset.toast);
    });
  });
</script>
</body>
</html>
