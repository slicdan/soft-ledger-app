<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="js/theme.js"></script>
<title>Customers — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pb-28">

    <!-- Fixed top section: header, search, filter tabs. List scrolls underneath. -->
    <div class="sticky top-0 z-20 bg-white pt-6 pb-3">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900">Customers</h1>
      <a href="add-customer.html"
        class="sl-btn-primary w-9 h-9 rounded-full text-white flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
    </div>

    <!-- Search -->
    <div class="mt-4 relative">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="text" placeholder="Search customers..." autocomplete="off"
        class="w-full bg-slate-50 border border-slate-100 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-700 placeholder-slate-400 outline-none">
    </div>

    <!-- Filter pills -->
    <div class="mt-4 -mx-5 px-5 flex items-center gap-2 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      <button data-filter="all"
        class="shrink-0 px-3 py-1.5 rounded-full text-sm font-medium sl-btn-primary text-white flex items-center gap-1.5">
        All <span id="count-all" class="text-[11px] font-medium px-2 py-0 rounded-full bg-white/20">0</span>
      </button>
      <button data-filter="owing"
        class="shrink-0 px-3 py-1.5 rounded-full text-sm font-medium border border-slate-200 text-slate-600 flex items-center gap-1.5">
        Owing <span id="count-owing" class="text-[11px] font-medium px-2 py-0 rounded-full bg-slate-100 text-slate-500">0</span>
      </button>
      <button data-filter="trusted"
        class="shrink-0 px-3 py-1.5 rounded-full text-sm font-medium border border-slate-200 text-slate-600 flex items-center gap-1.5">
        Trusted <span id="count-trusted" class="text-[11px] font-medium px-2 py-0 rounded-full bg-slate-100 text-slate-500">0</span>
      </button>
      <button data-filter="cards"
        class="shrink-0 px-3 py-1.5 rounded-full text-sm font-medium border border-slate-200 text-slate-600 flex items-center gap-1.5">
        Cards <span id="count-cards" class="text-[11px] font-medium px-2 py-0 rounded-full bg-slate-100 text-slate-500">0</span>
      </button>
    </div>

    </div>

    <!-- Customer list -->
    <div id="customer-list" class="mt-1 divide-y divide-slate-100"></div>
    <p id="customer-list-empty" class="hidden mt-8 text-sm text-slate-400 text-center">No customers yet. Tap + to add one.</p>
  </div>

  <!-- Bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100" style="padding-bottom:env(safe-area-inset-bottom,0px)">
    <div class="mx-auto lg:max-w-sm grid grid-cols-4">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
        </svg>
        <span class="text-[11px] font-medium">Home</span>
      </a>
      <button class="flex flex-col items-center gap-1 py-2.5 text-blue-600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-[11px] font-medium">Customers</span>
      </button>
      <a href="transactions.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
        </svg>
        <span class="text-[11px] font-medium">Transactions</span>
      </a>
      <a href="more.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        </svg>
        <span class="text-[11px] font-medium">More</span>
      </a>
    </div>
  </nav>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { showToast, formatNaira } from "./js/utils.js";
  import { listCustomersWithBalances } from "./js/customers.js";

  await requireAuth();

  document.querySelectorAll("[data-toast]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showToast("Coming Soon");
    });
  });

  const { data: customers, error } = await listCustomersWithBalances();
  const list = document.getElementById("customer-list");
  const empty = document.getElementById("customer-list-empty");
  const all = !error && customers ? customers : [];

  // Owing = outstanding balance; Trusted = no outstanding balance.
  const filters = {
    all: { match: () => true, emptyText: "No customers yet. Tap + to add one." },
    owing: { match: (c) => c.balance > 0, emptyText: "No customers owing right now." },
    trusted: { match: (c) => !(c.balance > 0), emptyText: "No trusted customers yet." },
    // No card data exists yet; the tab is a placeholder until cards are built.
    cards: { match: () => false, emptyText: "No cards yet." },
  };

  for (const [key, f] of Object.entries(filters)) {
    document.getElementById(`count-${key}`).textContent = all.filter(f.match).length;
  }

  let activeFilter = "all";
  let query = "";

  // Search by name (case-insensitive substring) or by amount (numeric query
  // matched against the customer's displayed amount, e.g. "500" matches ₦1,500).
  function matchesSearch(c, q) {
    if (!q) return true;
    if (c.full_name.toLowerCase().includes(q.toLowerCase())) return true;
    const numeric = q.replace(/[₦,\s]/g, "").replace(/\.$/, "");
    if (!/^\d+(\.\d+)?$/.test(numeric)) return false;
    const amount = Math.max(c.balance, 0);
    const amountStr = Number.isInteger(amount) ? String(amount) : amount.toFixed(2);
    return amountStr.includes(numeric);
  }

  function renderCustomers() {
    const f = filters[activeFilter];
    const rows = all.filter(f.match).filter((c) => matchesSearch(c, query));
    if (!rows.length) {
      list.innerHTML = "";
      empty.textContent = query && all.length ? `No customers match "${query}".` : f.emptyText;
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    list.innerHTML = rows.map((c) => {
      const initial = c.full_name.charAt(0).toUpperCase();
      const owing = c.balance > 0;
      const badge = owing
        ? `<span class="inline-block mt-1 text-[11px] font-medium px-2 py-0.5 rounded-full bg-rose-50 text-rose-500">Owing</span>`
        : `<span class="inline-block mt-1 text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600">Paid</span>`;
      return `
        <a href="customer-detail.html?id=${c.id}" class="w-full flex items-center gap-3 py-3.5 text-left">
          <span class="w-11 h-11 shrink-0 rounded-full bg-blue-900 text-white flex items-center justify-center text-sm font-semibold">${initial}</span>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-900">${c.full_name}</p>
            <p class="text-xs text-slate-400 mt-0.5">${c.phone}</p>
          </div>
          <div class="text-right">
            <p class="text-sm font-semibold text-slate-900">${formatNaira(Math.max(c.balance, 0))}</p>
            ${badge}
          </div>
        </a>`;
    }).join("");
  }

  // Only colour classes are toggled, so each pill keeps its own sizing/padding.
  const pills = document.querySelectorAll("[data-filter]");
  function setActivePill(activeKey) {
    pills.forEach((pill) => {
      const active = pill.dataset.filter === activeKey;
      const badge = pill.querySelector("span");
      pill.classList.toggle("sl-btn-primary", active);
      pill.classList.toggle("text-white", active);
      pill.classList.toggle("border", !active);
      pill.classList.toggle("border-slate-200", !active);
      pill.classList.toggle("text-slate-600", !active);
      badge.classList.toggle("bg-white/20", active);
      badge.classList.toggle("bg-slate-100", !active);
      badge.classList.toggle("text-slate-500", !active);
      pill.setAttribute("aria-pressed", active);
    });
  }

  pills.forEach((pill) => {
    pill.addEventListener("click", () => {
      activeFilter = pill.dataset.filter;
      setActivePill(activeFilter);
      pill.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" });
      renderCustomers();
    });
  });

  document.getElementById("search").addEventListener("input", (e) => {
    query = e.target.value.trim();
    renderCustomers();
  });

  setActivePill(activeFilter);
  renderCustomers();
</script>
</body>
</html>
