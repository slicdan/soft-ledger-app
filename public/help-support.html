<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="js/theme.js"></script>
<title>Help &amp; Support — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pt-6 pb-28">

    <!-- Header -->
    <div class="flex items-center gap-3">
      <a href="more.html" class="text-slate-900" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1 class="text-lg font-bold text-slate-900">Help &amp; Support</h1>
    </div>

    <!-- Cards -->
    <div class="mt-6 space-y-3">
      <button
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <span class="w-10 h-10 shrink-0 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-900">FAQs</p>
          <p class="text-xs text-slate-400 mt-0.5">Find answers to common questions</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <button
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <span class="w-10 h-10 shrink-0 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>
          </svg>
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-900">Contact Support</p>
          <p class="text-xs text-slate-400 mt-0.5">Get in touch with our team</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <button
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <span class="w-10 h-10 shrink-0 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="6" width="8" height="12" rx="4"/>
            <path d="M8 10H4"/><path d="M20 10h-4"/><path d="M8 14H4"/><path d="M20 14h-4"/>
            <path d="M12 6V4"/><path d="M10 4h4"/><path d="m8 8-2-2"/><path d="m16 8 2-2"/>
          </svg>
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-900">Report a Bug</p>
          <p class="text-xs text-slate-400 mt-0.5">Help us improve the app</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <button
        class="w-full flex items-center gap-3 border border-slate-100 rounded-2xl px-4 py-4 text-left">
        <span class="w-10 h-10 shrink-0 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18h6"/><path d="M10 22h4"/>
            <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.05V17h6v-.25c0-.85.4-1.55 1-2.05A7 7 0 0 0 12 2Z"/>
          </svg>
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-900">Feature Request</p>
          <p class="text-xs text-slate-400 mt-0.5">Suggest a new feature</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100" style="padding-bottom:env(safe-area-inset-bottom,0px)">
    <div class="mx-auto lg:max-w-sm grid grid-cols-4">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
        </svg>
        <span class="text-[11px] font-medium">Home</span>
      </a>
      <a href="customers.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-[11px] font-medium">Customers</span>
      </a>
      <a href="transactions.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
        </svg>
        <span class="text-[11px] font-medium">Transactions</span>
      </a>
      <a href="more.html" class="flex flex-col items-center gap-1 py-2.5 text-blue-600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        </svg>
        <span class="text-[11px] font-medium">More</span>
      </a>
    </div>
  </nav>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { showToast } from "./js/utils.js";

  requireAuth();

  document.querySelectorAll("[data-toast]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showToast("Coming Soon");
    });
  });
</script>
</body>
</html>
