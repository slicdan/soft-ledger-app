<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SoftLedger — Track. Manage. Keep it simple.</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white flex flex-col items-center justify-between px-6 py-16">

  <div class="flex-1 flex flex-col items-center justify-center text-center max-w-sm">
    <img src="assets/logo.svg" alt="" class="w-16 h-16 mb-6">

    <h1 class="text-3xl font-extrabold tracking-tight">
      <span class="text-slate-900">Soft</span><span class="text-blue-600">Ledger</span>
    </h1>

    <p class="mt-2 text-slate-500 text-base">Track. Manage. Keep it simple.</p>

    <p class="mt-6 text-sm text-slate-400 leading-relaxed">
      Manage your customers, charges,<br>and payments — all in one place.
    </p>
  </div>

  <div class="w-full max-w-sm space-y-4">
    <a href="signup.html"
       class="sl-btn-primary w-full flex items-center justify-center gap-2 text-white font-semibold py-3.5 rounded-full">
      Get Started
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
    <a href="login.html" class="block text-center sl-link font-medium py-1">Log In</a>
  </div>

</body>
</html>
