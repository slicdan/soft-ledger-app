<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log In — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white flex flex-col px-6 py-10">

  <div class="max-w-sm w-full mx-auto flex flex-col flex-1">

    <a href="index.html?onboarding" class="flex items-center gap-2 mb-10">
      <img src="assets/logo.svg" alt="" class="w-9 h-9">
      <span class="text-lg font-extrabold tracking-tight">
        <span class="text-slate-900">Soft</span><span class="text-blue-600">Ledger</span>
      </span>
    </a>

    <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
    <p class="mt-1 text-slate-500 text-sm">Log in to your account.</p>

    <div id="banner" class="hidden mt-5 text-sm rounded-lg px-4 py-3"></div>

    <form id="login-form" class="mt-6 space-y-4" novalidate>

      <div data-field>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="you@example.com">
        <p data-error class="hidden mt-1 text-xs text-red-500"></p>
      </div>

      <div data-field>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="••••••••">
        <p data-error class="hidden mt-1 text-xs text-red-500"></p>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-slate-600 select-none">
          <input id="remember-me" type="checkbox" checked
                 class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
          Remember me
        </label>
        <a href="#" id="forgot-password" class="sl-link font-medium">Forgot password?</a>
      </div>

      <button id="submit-btn" type="submit"
        class="sl-btn-primary w-full text-white font-semibold py-3.5 rounded-full mt-2">
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Don't have an account?
      <a href="signup.html" class="sl-link font-medium">Sign up</a>
    </p>
  </div>

<script type="module">
  import { signIn, resetPassword, redirectIfAuthenticated } from "./js/auth.js";
  import { setRememberMe } from "./js/supabase-client.js";
  import { setFieldError, isValidEmail, setLoading, showBanner } from "./js/utils.js";

  redirectIfAuthenticated();

  const form = document.getElementById("login-form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submit-btn");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const rememberEl = document.getElementById("remember-me");
  const forgotLink = document.getElementById("forgot-password");

  forgotLink.addEventListener("click", async (e) => {
    e.preventDefault();
    banner.classList.add("hidden");

    if (!isValidEmail(emailEl.value)) {
      setFieldError(emailEl, "Enter your email above, then click Forgot password");
      emailEl.focus();
      return;
    }
    setFieldError(emailEl, "");

    forgotLink.textContent = "Sending…";
    const { error } = await resetPassword(emailEl.value.trim());
    forgotLink.textContent = "Forgot password?";

    if (error) {
      showBanner(banner, error.message, "error");
      return;
    }
    showBanner(banner, `Reset link sent to ${emailEl.value.trim()}.`, "success");
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.classList.add("hidden");

    let valid = true;
    if (!isValidEmail(emailEl.value)) {
      setFieldError(emailEl, "Enter a valid email address");
      valid = false;
    } else {
      setFieldError(emailEl, "");
    }
    if (!passwordEl.value) {
      setFieldError(passwordEl, "Enter your password");
      valid = false;
    } else {
      setFieldError(passwordEl, "");
    }
    if (!valid) return;

    setRememberMe(rememberEl.checked);
    setLoading(submitBtn, true, "Logging in…");
    const { error } = await signIn({ email: emailEl.value.trim(), password: passwordEl.value });
    setLoading(submitBtn, false);

    if (error) {
      showBanner(banner, error.message, "error");
      return;
    }
    window.location.replace("dashboard.html");
  });
</script>
</body>
</html>
