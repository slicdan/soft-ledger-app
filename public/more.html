<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>More — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pt-6 pb-28">

    <!-- Header -->
    <h1 class="text-xl font-bold text-slate-900">More</h1>

    <!-- Profile row -->
    <div class="w-full flex items-center gap-3 mt-5 pb-4 border-b border-slate-100 text-left">
      <img src="assets/logo.svg" alt="" class="w-11 h-11 shrink-0 rounded-full bg-slate-50 p-1.5">
      <div class="flex-1 min-w-0">
        <p id="profile-name" class="text-sm font-semibold text-slate-900">SoftLedger</p>
        <p class="text-xs text-slate-400 mt-0.5">Store Owner</p>
      </div>
    </div>

    <!-- STORE -->
    <p class="mt-6 text-xs font-semibold tracking-wider uppercase text-slate-400">Store</p>
    <div class="mt-1 divide-y divide-slate-100">
      <a href="customers.html" class="flex items-center gap-3 py-3.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Customers</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>

      <a href="transactions.html" class="flex items-center gap-3 py-3.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Transactions</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>

      <a href="reports.html" class="flex items-center gap-3 py-3.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <path d="M9 17V9"/><path d="M13 17V5"/><path d="M17 17v-3"/>
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Reports</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>

      <a href="store-settings.html" class="flex items-center gap-3 py-3.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Store Settings</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
    </div>

    <!-- PLAN -->
    <p class="mt-6 text-xs font-semibold tracking-wider uppercase text-slate-400">Plan</p>
    <div class="mt-1">
      <button class="w-full flex items-center gap-3 py-3.5 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 shrink-0">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        </svg>
        <span class="text-sm font-medium text-blue-600">Upgrade plan</span>
      </button>
    </div>

    <!-- SUPPORT -->
    <p class="mt-6 text-xs font-semibold tracking-wider uppercase text-slate-400">Support</p>
    <div class="mt-1 divide-y divide-slate-100">
      <a href="help-support.html" class="flex items-center gap-3 py-3.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Help &amp; Support</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>

      <a href="about.html" class="w-full flex items-center gap-3 py-3.5 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">About</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
    </div>

    <!-- Log out -->
    <div class="mt-5 pt-1 border-t border-slate-100">
      <button id="logout-btn" class="w-full flex items-center gap-3 py-3.5 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-500 shrink-0">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="text-sm font-medium text-rose-500">Log Out</span>
      </button>
    </div>

  </div>

  <!-- Log out confirmation modal -->
  <div id="logout-modal" class="hidden fixed inset-0 z-50">
    <div id="logout-backdrop" class="absolute inset-0 bg-slate-900/40"></div>
    <div class="absolute inset-0 flex items-center justify-center px-8">
      <div class="relative w-full max-w-xs bg-white rounded-2xl px-6 pt-7 pb-6 text-center shadow-xl">
        <div class="mx-auto w-14 h-14 rounded-full bg-rose-50 flex items-center justify-center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-500">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <h2 class="mt-4 text-base font-bold text-slate-900">Log Out</h2>
        <p class="mt-1.5 text-sm text-slate-500">Are you sure you want to log out of your account?</p>

        <button id="logout-confirm-btn"
          class="mt-5 w-full bg-rose-500 text-white font-semibold py-3 rounded-full transition-opacity">
          Log Out
        </button>
        <button id="logout-cancel-btn"
          class="mt-2.5 w-full bg-slate-100 text-slate-700 font-semibold py-3 rounded-full">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100" style="padding-bottom:env(safe-area-inset-bottom,0px)">
    <div class="mx-auto lg:max-w-sm grid grid-cols-4">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
        </svg>
        <span class="text-[11px] font-medium">Home</span>
      </a>
      <a href="customers.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-[11px] font-medium">Customers</span>
      </a>
      <a href="transactions.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
        </svg>
        <span class="text-[11px] font-medium">Transactions</span>
      </a>
      <button class="flex flex-col items-center gap-1 py-2.5 text-blue-600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        </svg>
        <span class="text-[11px] font-medium">More</span>
      </button>
    </div>
  </nav>

<script type="module">
  import { requireAuth, signOut } from "./js/auth.js";
  import { supabase } from "./js/supabase-client.js";
  import { showToast } from "./js/utils.js";

  const session = await requireAuth();
  if (session) {
    const { data: { user } } = await supabase.auth.getUser();
    const fullName = user?.user_metadata?.full_name;
    if (fullName) document.getElementById("profile-name").textContent = fullName;
  }

  const logoutModal = document.getElementById("logout-modal");
  const openLogoutModal = () => logoutModal.classList.remove("hidden");
  const closeLogoutModal = () => logoutModal.classList.add("hidden");

  document.getElementById("logout-btn").addEventListener("click", openLogoutModal);
  document.getElementById("logout-cancel-btn").addEventListener("click", closeLogoutModal);
  document.getElementById("logout-backdrop").addEventListener("click", closeLogoutModal);

  document.getElementById("logout-confirm-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.classList.add("opacity-70");
    btn.textContent = "Logging out…";

    // Server-side: revokes the refresh token via Supabase Auth so the
    // session can no longer be used from anywhere.
    // Client-side: clears the local session/tokens once the call resolves.
    const { error } = await signOut();

    if (error) {
      btn.disabled = false;
      btn.classList.remove("opacity-70");
      btn.textContent = "Log Out";
      closeLogoutModal();
      showToast("Couldn't log out — try again");
      return;
    }

    window.location.replace("login.html");
  });

  document.querySelectorAll("[data-toast]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showToast("Coming Soon");
    });
  });
</script>
</body>
</html>
