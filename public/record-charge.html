<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="js/theme.js"></script>
<title>Record Charge — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pt-6 pb-10">

    <!-- Header -->
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-slate-900" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1 class="text-lg font-bold text-slate-900">Record Charge</h1>
    </div>

    <form id="record-charge-form" class="mt-6 space-y-6">

      <!-- Customer -->
      <div>
        <p class="text-sm font-semibold text-slate-900 mb-2">Customer</p>
        <div id="customer-select"></div>
        <p id="no-customers-note" class="hidden mt-2 text-xs text-rose-500">
          No customers yet. <a href="add-customer.html" class="sl-link font-medium">Add one first</a>.
        </p>
      </div>

      <!-- Device / Item -->
      <div id="device-picker"></div>

      <!-- Charging Duration -->
      <div>
        <p class="text-sm font-semibold text-slate-900 mb-2">Charging Duration</p>
        <div class="grid grid-cols-4 gap-2" id="duration-group">
          <button type="button" data-value="1h" aria-pressed="false"
            class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">1h</button>
          <button type="button" data-value="2h" aria-pressed="true"
            class="duration-btn py-2.5 rounded-full sl-btn-primary text-white text-sm font-medium">2h</button>
          <button type="button" data-value="3h" aria-pressed="false"
            class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">3h</button>
          <button type="button" data-value="Custom" aria-pressed="false"
            class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">Custom</button>
        </div>
      </div>

      <!-- Amount -->
      <div>
        <label for="amount" class="block text-sm font-semibold text-slate-900 mb-1.5">Amount (₦)</label>
        <input id="amount" type="number" inputmode="numeric" min="0" step="50" required
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="e.g. 100">
      </div>

      <!-- Notes -->
      <div>
        <label for="notes" class="block text-sm font-semibold text-slate-900 mb-1.5">Notes (optional)</label>
        <textarea id="notes" rows="2"
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition resize-none"
               placeholder="e.g. iPhone 13, 2% battery"></textarea>
      </div>

      <button type="submit"
        class="sl-btn-primary w-full text-white font-semibold py-3.5 rounded-full">
        Save Record
      </button>
    </form>
  </div>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { createSelect } from "./js/custom-select.js";
  import { createDevicePicker } from "./js/device-picker.js?v=5";
  import { showToast, setLoading } from "./js/utils.js";
  import { listCustomersBasic } from "./js/customers.js";
  import { createCharge } from "./js/charges.js";

  await requireAuth();

  const customerSelect = createSelect(document.getElementById("customer-select"), {
    placeholder: "Loading customers…",
    searchPlaceholder: "Search customer...",
  });
  const { data: customers, error: customersError } = await listCustomersBasic();
  if (customersError || !customers || !customers.length) {
    customerSelect.setPlaceholder("No customers available");
    customerSelect.setDisabled(true);
    document.getElementById("no-customers-note").classList.remove("hidden");
  } else {
    customerSelect.setOptions(
      customers.map((c) => ({ value: c.id, label: c.full_name, sub: c.phone }))
    );
  }

  // Predefined unit costs (₦) per device. Only Phone is priced for now;
  // devices without an entry are never auto-priced.
  const UNIT_PRICES = { Phone: 100 };

  const amountEl = document.getElementById("amount");
  let amountAutoFilled = false; // true while the Amount holds a computed value
  amountEl.addEventListener("input", () => { amountAutoFilled = false; });

  // Priced device: Amount = quantity × unit cost, kept in sync on every
  // quantity change. Unpriced device / no device: clear the Amount only if we
  // put it there (never a typed value).
  function syncAmount() {
    const price = UNIT_PRICES[devicePicker.value];
    if (price !== undefined && devicePicker.quantity > 0) {
      amountEl.value = String(price * devicePicker.quantity);
      amountAutoFilled = true;
    } else if (amountAutoFilled) {
      amountEl.value = "";
      amountAutoFilled = false;
    }
  }

  const devicePicker = createDevicePicker(document.getElementById("device-picker"), { onChange: syncAmount });

  let selectedDuration = "2h";
  document.querySelectorAll(".duration-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.value === "Custom") {
        showToast("Coming Soon");
        return;
      }
      document.querySelectorAll(".duration-btn").forEach((b) => {
        b.setAttribute("aria-pressed", "false");
        b.classList.remove("sl-btn-primary", "text-white");
        b.classList.add("border", "border-slate-200", "text-slate-600");
      });
      btn.setAttribute("aria-pressed", "true");
      btn.classList.remove("border", "border-slate-200", "text-slate-600");
      btn.classList.add("sl-btn-primary", "text-white");
      selectedDuration = btn.dataset.value;
    });
  });

  document.getElementById("record-charge-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector("button[type=submit]");
    const customerId = customerSelect.value;
    const amount = Number(document.getElementById("amount").value);
    const notes = document.getElementById("notes").value.trim();

    if (!customerId) {
      showToast("Choose a customer first");
      return;
    }
    if (!devicePicker.value) {
      showToast("Choose a device first");
      return;
    }

    setLoading(submitBtn, true, "Saving…");
    const { error } = await createCharge({
      customerId,
      device: devicePicker.value,
      quantity: devicePicker.quantity,
      duration: selectedDuration,
      amount,
      notes,
    });
    setLoading(submitBtn, false);

    if (error) {
      showToast("Couldn't save charge", "error", "Please try again");
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
