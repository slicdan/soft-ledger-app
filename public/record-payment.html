<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="js/theme.js"></script>
<title>Record Payment — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pt-6 pb-10">

    <!-- Header -->
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-slate-900" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1 class="text-lg font-bold text-slate-900">Record Payment</h1>
    </div>

    <form id="record-payment-form" class="mt-6 space-y-6">

      <!-- Payment Recipient -->
      <div>
        <p id="recipient-label" class="text-sm font-semibold text-slate-900 mb-2">Payment Recipient</p>
        <div id="recipient-group" role="radiogroup" aria-labelledby="recipient-label"
             class="grid grid-cols-2 gap-1 p-1 rounded-xl border border-slate-200">
          <button type="button" role="radio" data-value="customer" aria-checked="true"
            class="recipient-btn flex items-center justify-center gap-2 py-2.5 rounded-lg border border-blue-200 bg-blue-50 text-blue-600 text-sm font-medium">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
            Customer
          </button>
          <button type="button" role="radio" data-value="tag" aria-checked="false"
            class="recipient-btn flex items-center justify-center gap-2 py-2.5 rounded-lg border border-transparent text-slate-500 text-sm font-medium">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.5"/></svg>
            Customer Tags
          </button>
        </div>
      </div>

      <!-- Customer -->
      <div id="customer-field">
        <p class="text-sm font-semibold text-slate-900 mb-2">Customer</p>
        <div id="customer-select"></div>
        <p id="owes-label" class="hidden mt-2 text-xs font-semibold text-rose-500"></p>
        <p id="no-customers-note" class="hidden mt-2 text-xs text-rose-500">
          No customers yet. <a href="add-customer.html" class="sl-link font-medium">Add one first</a>.
        </p>
      </div>

      <!-- Customer Tag -->
      <div id="tag-field" class="hidden">
        <p class="text-sm font-semibold text-slate-900 mb-2">Customer Tag</p>
        <div id="tag-select"></div>
        <p id="no-tags-note" class="hidden mt-2 text-xs text-rose-500">
          No tags yet. <a href="add-tag.html" class="sl-link font-medium">Add one first</a>.
        </p>
      </div>

      <!-- Amount -->
      <div>
        <label for="amount" class="block text-sm font-semibold text-slate-900 mb-1.5">Amount (₦)</label>
        <input id="amount" type="number" inputmode="numeric" min="0" step="50" required
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="e.g. 100">
      </div>

      <!-- Device / Item (Customer Tags only) -->
      <div id="device-field" class="hidden">
        <div id="device-picker"></div>
      </div>

      <!-- Payment Method -->
      <div>
        <p class="text-sm font-semibold text-slate-900 mb-2">Payment Method</p>
        <div class="grid grid-cols-3 gap-2" id="method-group">
          <button type="button" data-value="Cash" aria-pressed="true"
            class="method-btn flex flex-col items-center gap-1.5 py-3.5 rounded-xl border-2 border-blue-600 bg-blue-50 text-blue-600">
            <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
              <path d="M128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152ZM240,56H16a8,8,0,0,0-8,8V192a8,8,0,0,0,8,8H240a8,8,0,0,0,8-8V64A8,8,0,0,0,240,56ZM193.65,184H62.35A56.78,56.78,0,0,0,24,145.65v-35.3A56.78,56.78,0,0,0,62.35,72h131.3A56.78,56.78,0,0,0,232,110.35v35.3A56.78,56.78,0,0,0,193.65,184ZM232,93.37A40.81,40.81,0,0,1,210.63,72H232ZM45.37,72A40.81,40.81,0,0,1,24,93.37V72ZM24,162.63A40.81,40.81,0,0,1,45.37,184H24ZM210.63,184A40.81,40.81,0,0,1,232,162.63V184Z"/>
            </svg>
            <span class="text-xs font-medium">Cash</span>
          </button>
          <button type="button" data-value="Transfer" aria-pressed="false"
            class="method-btn flex flex-col items-center gap-1.5 py-3.5 rounded-xl border border-slate-200 text-slate-500">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
            </svg>
            <span class="text-xs font-medium">Transfer</span>
          </button>
          <button type="button" data-value="Other" aria-pressed="false"
            class="method-btn flex flex-col items-center gap-1.5 py-3.5 rounded-xl border border-slate-200 text-slate-500">
            <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
              <path d="M227.32,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H216a8,8,0,0,0,0-16H115.32l112-112A16,16,0,0,0,227.32,73.37ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.69,147.32,64l24-24L216,84.69Z"/>
            </svg>
            <span class="text-xs font-medium">Other</span>
          </button>
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label for="notes" class="block text-sm font-semibold text-slate-900 mb-1.5">Notes (optional)</label>
        <textarea id="notes" rows="2"
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition resize-none"
               placeholder="e.g. Partial payment"></textarea>
      </div>

      <button type="submit"
        class="sl-btn-primary w-full text-white font-semibold py-3.5 rounded-full">
        Save Payment
      </button>
    </form>
  </div>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { createSelect } from "./js/custom-select.js";
  import { createDevicePicker } from "./js/device-picker.js?v=5";
  import { showToast, setLoading, formatNaira } from "./js/utils.js";
  import { listCustomersBasic, getCustomerBalance } from "./js/customers.js";
  import { listTags } from "./js/tags.js";
  import { createPayment } from "./js/payments.js";

  await requireAuth();

  const customerSelect = createSelect(document.getElementById("customer-select"), {
    placeholder: "Loading customers…",
    searchPlaceholder: "Search customer...",
    onChange: () => updateOwesLabel(),
  });
  const tagSelect = createSelect(document.getElementById("tag-select"), {
    placeholder: "Loading tags…",
    searchPlaceholder: "Search tag...",
  });
  // Predefined unit costs (₦) per device. Only Phone is priced for now;
  // devices without an entry are never auto-priced.
  const UNIT_PRICES = { Phone: 100 };

  const amountEl = document.getElementById("amount");
  let amountAutoFilled = false; // true while the Amount holds a computed value
  amountEl.addEventListener("input", () => { amountAutoFilled = false; });

  // Tag payments where every selected device is priced: Amount = Σ quantity ×
  // unit cost, kept in sync on every change. Any unpriced device / no device /
  // Customer mode: clear the Amount only if we put it there (never a typed
  // value).
  function syncAmount() {
    const items = recipient === "tag" ? devicePicker.items : [];
    const allPriced = items.length > 0 && items.every((it) => UNIT_PRICES[it.device] !== undefined);
    if (allPriced) {
      amountEl.value = String(items.reduce((sum, it) => sum + UNIT_PRICES[it.device] * it.quantity, 0));
      amountAutoFilled = true;
    } else if (amountAutoFilled) {
      amountEl.value = "";
      amountAutoFilled = false;
    }
  }

  const devicePicker = createDevicePicker(document.getElementById("device-picker"), { onChange: syncAmount, multi: true });
  const owesLabel = document.getElementById("owes-label");

  // Recipient type drives which picker shows; the other one stays mounted
  // (keeps its selection) but hidden, and only the active one is submitted.
  let recipient = "customer";
  const recipientBtns = document.querySelectorAll(".recipient-btn");
  const ACTIVE = ["border-blue-200", "bg-blue-50", "text-blue-600"];
  const IDLE = ["border-transparent", "text-slate-500"];

  function setRecipient(next) {
    recipient = next;
    recipientBtns.forEach((b) => {
      const on = b.dataset.value === next;
      b.setAttribute("aria-checked", String(on));
      b.classList.remove(...ACTIVE, ...IDLE);
      b.classList.add(...(on ? ACTIVE : IDLE));
    });
    document.getElementById("customer-field").classList.toggle("hidden", next !== "customer");
    document.getElementById("tag-field").classList.toggle("hidden", next !== "tag");
    document.getElementById("device-field").classList.toggle("hidden", next !== "tag");
    if (next === "customer") updateOwesLabel();
    syncAmount();
  }
  recipientBtns.forEach((b) => b.addEventListener("click", () => setRecipient(b.dataset.value)));

  async function updateOwesLabel() {
    const customerId = customerSelect.value;
    if (!customerId) {
      owesLabel.classList.add("hidden");
      return;
    }
    const { data: balanceRow, error } = await getCustomerBalance(customerId);
    if (error || !balanceRow || balanceRow.balance <= 0) {
      owesLabel.classList.add("hidden");
      return;
    }
    owesLabel.textContent = `Owes ${formatNaira(balanceRow.balance)}`;
    owesLabel.classList.remove("hidden");
  }

  const { data: customers, error: customersError } = await listCustomersBasic();
  if (customersError || !customers || !customers.length) {
    customerSelect.setPlaceholder("No customers available");
    customerSelect.setDisabled(true);
    document.getElementById("no-customers-note").classList.remove("hidden");
  } else {
    customerSelect.setOptions(
      customers.map((c) => ({ value: c.id, label: c.full_name, sub: c.phone }))
    );
    await updateOwesLabel();
  }

  const { data: tags, error: tagsError } = await listTags();
  if (tagsError || !tags || !tags.length) {
    tagSelect.setPlaceholder("No tags available");
    tagSelect.setDisabled(true);
    document.getElementById("no-tags-note").classList.remove("hidden");
  } else {
    tagSelect.setOptions(
      tags.map((t) => ({ value: t.id, label: `Tag ${t.tag_no}`, sub: t.full_name || t.phone, avatar: "#" }))
    );
  }

  let selectedMethod = "Cash";
  document.querySelectorAll(".method-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".method-btn").forEach((b) => {
        b.setAttribute("aria-pressed", "false");
        b.classList.remove("border-2", "border-blue-600", "bg-blue-50", "text-blue-600");
        b.classList.add("border", "border-slate-200", "text-slate-500");
      });
      btn.setAttribute("aria-pressed", "true");
      btn.classList.remove("border", "border-slate-200", "text-slate-500");
      btn.classList.add("border-2", "border-blue-600", "bg-blue-50", "text-blue-600");
      selectedMethod = btn.dataset.value;
    });
  });

  document.getElementById("record-payment-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector("button[type=submit]");
    const customerId = recipient === "customer" ? customerSelect.value : "";
    const tagId = recipient === "tag" ? tagSelect.value : "";
    const amount = Number(document.getElementById("amount").value);
    const notes = document.getElementById("notes").value.trim();

    if (recipient === "customer" && !customerId) {
      showToast("Choose a customer first");
      return;
    }
    if (recipient === "tag" && !tagId) {
      showToast("Choose a tag first");
      return;
    }
    if (recipient === "tag" && !devicePicker.items.length) {
      showToast("Choose a device first");
      return;
    }

    setLoading(submitBtn, true, "Saving…");
    const { error } = await createPayment({
      customerId,
      tagId,
      items: recipient === "tag" ? devicePicker.items : [],
      amount,
      method: selectedMethod,
      notes,
    });

    if (error) {
      setLoading(submitBtn, false);
      showToast("Couldn't save payment — try again");
      return;
    }
    // Keep the button locked so a second tap can't double-record, and give
    // the toast a moment to be seen before leaving the page.
    showToast("Payment saved", "success");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
  });

  document.querySelectorAll("[data-toast]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showToast("Coming Soon");
    });
  });
</script>
</body>
</html>
