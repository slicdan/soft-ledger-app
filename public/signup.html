<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign Up — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white flex flex-col px-6 py-10">

  <div class="max-w-sm w-full mx-auto flex flex-col flex-1">

    <a href="index.html" class="flex items-center gap-2 mb-10">
      <img src="assets/logo.svg" alt="" class="w-9 h-9">
      <span class="text-lg font-extrabold tracking-tight">
        <span class="text-slate-900">Soft</span><span class="text-blue-600">Ledger</span>
      </span>
    </a>

    <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
    <p class="mt-1 text-slate-500 text-sm">Start managing customers, charges, and payments.</p>

    <div id="banner" class="hidden mt-5 text-sm rounded-lg px-4 py-3"></div>

    <form id="signup-form" class="mt-6 space-y-4" novalidate>

      <div data-field>
        <label for="full-name" class="block text-sm font-medium text-slate-700 mb-1.5">Full name</label>
        <input id="full-name" name="fullName" type="text" autocomplete="name" required
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="Jane Doe">
        <p data-error class="hidden mt-1 text-xs text-red-500"></p>
      </div>

      <div data-field>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="you@example.com">
        <p data-error class="hidden mt-1 text-xs text-red-500"></p>
      </div>

      <div data-field>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"
               class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition"
               placeholder="At least 8 characters">
        <p data-error class="hidden mt-1 text-xs text-red-500"></p>
      </div>

      <button id="submit-btn" type="submit"
        class="sl-btn-primary w-full text-white font-semibold py-3.5 rounded-full mt-2">
        Sign Up
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account?
      <a href="login.html" class="sl-link font-medium">Log in</a>
    </p>
  </div>

<script type="module">
  import { signUp, redirectIfAuthenticated } from "./js/auth.js";
  import { setFieldError, isValidEmail, setLoading, showBanner } from "./js/utils.js";

  redirectIfAuthenticated();

  const form = document.getElementById("signup-form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submit-btn");
  const nameEl = document.getElementById("full-name");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.classList.add("hidden");

    let valid = true;
    if (!nameEl.value.trim()) {
      setFieldError(nameEl, "Enter your name");
      valid = false;
    } else {
      setFieldError(nameEl, "");
    }
    if (!isValidEmail(emailEl.value)) {
      setFieldError(emailEl, "Enter a valid email address");
      valid = false;
    } else {
      setFieldError(emailEl, "");
    }
    if (passwordEl.value.length < 8) {
      setFieldError(passwordEl, "Use at least 8 characters");
      valid = false;
    } else {
      setFieldError(passwordEl, "");
    }
    if (!valid) return;

    setLoading(submitBtn, true, "Creating account…");
    const { data, error } = await signUp({
      email: emailEl.value.trim(),
      password: passwordEl.value,
      fullName: nameEl.value.trim(),
    });
    setLoading(submitBtn, false);

    if (error) {
      showBanner(banner, error.message, "error");
      return;
    }
    if (data.session) {
      window.location.href = "dashboard.html";
      return;
    }
    showBanner(banner, "Account created. Check your email to confirm, then log in.", "success");
    form.reset();
  });
</script>
</body>
</html>
