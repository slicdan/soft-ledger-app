<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Store Settings — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto lg:max-w-sm px-5 pt-6 pb-28">

    <!-- Header -->
    <div class="flex items-center gap-3">
      <a href="more.html" class="text-slate-900" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1 class="text-lg font-bold text-slate-900">Store Settings</h1>
    </div>

    <!-- Store Information -->
    <h2 class="mt-6 text-sm font-bold text-slate-900">Store Information</h2>
    <div class="mt-2 divide-y divide-slate-100 border-t border-b border-slate-100">
      <button data-toast="Edit store name coming soon" class="w-full flex items-center justify-between py-3.5 text-left">
        <span class="text-sm text-slate-700">Store Name</span>
        <span class="flex items-center gap-1.5 text-sm font-medium text-slate-900">
          ChargeTrack
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </span>
      </button>
      <button data-toast="Edit business type coming soon" class="w-full flex items-center justify-between py-3.5 text-left">
        <span class="text-sm text-slate-700">Business Type</span>
        <span class="flex items-center gap-1.5 text-sm font-medium text-slate-900">
          Charging Store
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </span>
      </button>
      <button data-toast="Edit location coming soon" class="w-full flex items-center justify-between py-3.5 text-left">
        <span class="text-sm text-slate-700">Location</span>
        <span class="flex items-center gap-1.5 text-sm font-medium text-slate-900">
          Lagos, Nigeria
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </span>
      </button>
    </div>

    <!-- Preferences -->
    <h2 class="mt-6 text-sm font-bold text-slate-900">Preferences</h2>
    <div class="mt-2 divide-y divide-slate-100 border-t border-b border-slate-100">
      <div class="flex items-center justify-between py-3.5">
        <span class="text-sm text-slate-700">Enable Notifications</span>
        <label class="relative inline-flex items-center cursor-pointer shrink-0">
          <input id="notifications-toggle" type="checkbox" checked class="sr-only peer">
          <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-blue-600 transition-colors"></div>
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
        </label>
      </div>
      <div class="flex items-center justify-between py-3.5">
        <span class="text-sm text-slate-700">Auto Backup</span>
        <label class="relative inline-flex items-center cursor-pointer shrink-0">
          <input id="backup-toggle" type="checkbox" checked class="sr-only peer">
          <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-blue-600 transition-colors"></div>
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
        </label>
      </div>
      <div class="flex items-center justify-between py-3.5">
        <span class="text-sm text-slate-700">Dark Mode</span>
        <label class="relative inline-flex items-center cursor-pointer shrink-0">
          <input id="dark-mode-toggle" type="checkbox" class="sr-only peer">
          <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-blue-600 transition-colors"></div>
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
        </label>
      </div>
    </div>

    <!-- Data Management -->
    <h2 class="mt-6 text-sm font-bold text-slate-900">Data Management</h2>
    <div class="mt-2 divide-y divide-slate-100 border-t border-b border-slate-100">
      <button data-toast="Export data coming soon" class="w-full flex items-center gap-3 py-3.5 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Export Data</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <button data-toast="Clear cache coming soon" class="w-full flex items-center gap-3 py-3.5 text-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 shrink-0">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
        <span class="flex-1 text-sm font-medium text-slate-900">Clear Cache</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 shrink-0">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100" style="padding-bottom:env(safe-area-inset-bottom,0px)">
    <div class="mx-auto lg:max-w-sm grid grid-cols-4">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
        </svg>
        <span class="text-[11px] font-medium">Home</span>
      </a>
      <a href="customers.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M17 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-[11px] font-medium">Customers</span>
      </a>
      <a href="transactions.html" class="flex flex-col items-center gap-1 py-2.5 text-slate-400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/>
        </svg>
        <span class="text-[11px] font-medium">Transactions</span>
      </a>
      <a href="more.html" class="flex flex-col items-center gap-1 py-2.5 text-blue-600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        </svg>
        <span class="text-[11px] font-medium">More</span>
      </a>
    </div>
  </nav>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { showToast } from "./js/utils.js";

  requireAuth();

  document.getElementById("notifications-toggle").addEventListener("change", (e) => {
    showToast(e.target.checked ? "Notifications enabled" : "Notifications disabled");
  });
  document.getElementById("backup-toggle").addEventListener("change", (e) => {
    showToast(e.target.checked ? "Auto backup enabled" : "Auto backup disabled");
  });
  document.getElementById("dark-mode-toggle").addEventListener("click", (e) => {
    e.preventDefault();
    showToast("Dark mode coming soon");
  });

  document.querySelectorAll("[data-toast]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      showToast(el.dataset.toast);
    });
  });
</script>
</body>
</html>
