<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="js/theme.js"></script>
<title>Transaction — SoftLedger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white">

  <div class="mx-auto sm:max-w-sm px-5 pt-6 pb-10">

    <!-- Header -->
    <div class="flex items-center gap-3">
      <button id="back-btn" class="text-slate-900" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 id="page-title" class="text-lg font-bold text-slate-900">Transaction</h1>
    </div>

    <p id="load-error" class="hidden mt-6 text-sm text-rose-500 text-center">Couldn't load this transaction.</p>

    <div id="content" class="hidden">

      <!-- Summary -->
      <div class="mt-6 rounded-2xl p-5 flex items-start justify-between gap-4 sl-hero-card">
        <div class="min-w-0">
          <p id="type-label" class="text-slate-400 text-xs"></p>
          <div id="device-summary" class="hidden mt-3 mb-2 flex items-center gap-3">
            <span id="device-summary-icon" class="w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-white" style="background:rgba(255,255,255,0.12)"></span>
            <div class="min-w-0">
              <p id="device-summary-title" class="text-white text-lg font-semibold leading-tight"></p>
              <p id="device-summary-amount" class="text-blue-300 text-sm font-medium mt-0.5"></p>
            </div>
          </div>
          <p id="amount-display" class="text-white text-2xl font-bold mt-1"></p>
          <a id="customer-link" href="#" class="inline-block mt-3 text-sm text-blue-300 font-medium"></a>
          <p id="created-at-display" class="text-slate-500 text-xs mt-1"></p>
        </div>
        <div id="owing-badge" class="hidden shrink-0 items-stretch gap-3">
          <div class="w-px bg-slate-700"></div>
          <div class="rounded-xl px-3 py-2 flex flex-col items-start justify-center gap-1" style="background:rgba(217,119,6,0.15)">
            <span class="flex items-center gap-1 text-amber-400 text-xs font-medium">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
              Owing
            </span>
            <span id="owing-amount" class="text-amber-400 text-lg font-bold"></span>
          </div>
        </div>
      </div>

      <!-- View mode -->
      <div id="view-mode" class="mt-6 space-y-4">
        <div id="view-duration-row" class="hidden flex items-center justify-between py-2 border-b border-slate-100">
          <span class="text-sm text-slate-500">Duration</span>
          <span id="view-duration" class="text-sm font-medium text-slate-900"></span>
        </div>
        <div id="view-method-row" class="hidden flex items-center justify-between py-2 border-b border-slate-100">
          <span class="text-sm text-slate-500">Method</span>
          <span id="view-method" class="text-sm font-medium text-slate-900"></span>
        </div>
        <div>
          <p class="text-sm text-slate-500">Notes</p>
          <p id="view-notes" class="text-sm text-slate-900 mt-1">—</p>
        </div>

        <button id="edit-btn" class="sl-btn-primary w-full text-white font-semibold py-3.5 rounded-full mt-2">
          Edit
        </button>
        <button id="delete-btn" class="w-full border border-rose-200 text-rose-500 font-semibold py-3.5 rounded-full">
          Delete
        </button>
      </div>

      <!-- Edit mode -->
      <form id="edit-form" class="hidden mt-6 space-y-6">

        <!-- Device / Item (charge only) -->
        <div id="edit-device-field" class="hidden">
          <p class="text-sm font-semibold text-slate-900 mb-2">Device / Item</p>
          <div class="grid grid-cols-4 gap-2" id="device-group">
            <button type="button" data-value="Phone" class="device-btn flex flex-col items-center gap-1.5 py-3 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
              <span class="text-xs font-medium">Phone</span>
            </button>
            <button type="button" data-value="Power Bank" class="device-btn flex flex-col items-center gap-1.5 py-3 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M150.81,131.79a8,8,0,0,1,.35,7.79l-16,32a8,8,0,0,1-14.32-7.16L131.06,144H112a8,8,0,0,1-7.16-11.58l16-32a8,8,0,1,1,14.32,7.16L124.94,128H144A8,8,0,0,1,150.81,131.79ZM96,16h64a8,8,0,0,0,0-16H96a8,8,0,0,0,0,16ZM200,56V224a24,24,0,0,1-24,24H80a24,24,0,0,1-24-24V56A24,24,0,0,1,80,32h96A24,24,0,0,1,200,56Zm-16,0a8,8,0,0,0-8-8H80a8,8,0,0,0-8,8V224a8,8,0,0,0,8,8h96a8,8,0,0,0,8-8Z"/></svg>
              <span class="text-xs font-medium">Power Bank</span>
            </button>
            <button type="button" data-value="Laptop" class="device-btn flex flex-col items-center gap-1.5 py-3 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
              <span class="text-xs font-medium">Laptop</span>
            </button>
            <button type="button" data-value="Other" class="device-btn flex flex-col items-center gap-1.5 py-3 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg>
              <span class="text-xs font-medium">Other</span>
            </button>
          </div>
        </div>

        <!-- Charging Duration (charge only) -->
        <div id="edit-duration-field" class="hidden">
          <p class="text-sm font-semibold text-slate-900 mb-2">Charging Duration</p>
          <div class="grid grid-cols-4 gap-2" id="duration-group">
            <button type="button" data-value="1h" class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">1h</button>
            <button type="button" data-value="2h" class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">2h</button>
            <button type="button" data-value="3h" class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">3h</button>
            <button type="button" data-value="Custom" class="duration-btn py-2.5 rounded-full border border-slate-200 text-slate-600 text-sm font-medium">Custom</button>
          </div>
        </div>

        <!-- Payment Method (payment only) -->
        <div id="edit-method-field" class="hidden">
          <p class="text-sm font-semibold text-slate-900 mb-2">Payment Method</p>
          <div class="grid grid-cols-3 gap-2" id="method-group">
            <button type="button" data-value="Cash" class="method-btn flex flex-col items-center gap-1.5 py-3.5 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152ZM240,56H16a8,8,0,0,0-8,8V192a8,8,0,0,0,8,8H240a8,8,0,0,0,8-8V64A8,8,0,0,0,240,56ZM193.65,184H62.35A56.78,56.78,0,0,0,24,145.65v-35.3A56.78,56.78,0,0,0,62.35,72h131.3A56.78,56.78,0,0,0,232,110.35v35.3A56.78,56.78,0,0,0,193.65,184ZM232,93.37A40.81,40.81,0,0,1,210.63,72H232ZM45.37,72A40.81,40.81,0,0,1,24,93.37V72ZM24,162.63A40.81,40.81,0,0,1,45.37,184H24ZM210.63,184A40.81,40.81,0,0,1,232,162.63V184Z"/></svg>
              <span class="text-xs font-medium">Cash</span>
            </button>
            <button type="button" data-value="Transfer" class="method-btn flex flex-col items-center gap-1.5 py-3.5 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/></svg>
              <span class="text-xs font-medium">Transfer</span>
            </button>
            <button type="button" data-value="Other" class="method-btn flex flex-col items-center gap-1.5 py-3.5 rounded-xl border border-slate-200 text-slate-500">
              <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M227.32,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H216a8,8,0,0,0,0-16H115.32l112-112A16,16,0,0,0,227.32,73.37ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.69,147.32,64l24-24L216,84.69Z"/></svg>
              <span class="text-xs font-medium">Other</span>
            </button>
          </div>
        </div>

        <!-- Amount -->
        <div>
          <label for="edit-amount" class="block text-sm font-semibold text-slate-900 mb-1.5">Amount (₦)</label>
          <input id="edit-amount" type="number" inputmode="numeric" min="0" step="50" required
                 class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition">
        </div>

        <!-- Notes -->
        <div>
          <label for="edit-notes" class="block text-sm font-semibold text-slate-900 mb-1.5">Notes (optional)</label>
          <textarea id="edit-notes" rows="2"
                 class="sl-input w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none transition resize-none"></textarea>
        </div>

        <div class="flex gap-3">
          <button type="button" id="cancel-edit-btn" class="flex-1 border border-slate-200 text-slate-700 font-semibold py-3.5 rounded-full">
            Cancel
          </button>
          <button type="submit" class="flex-1 sl-btn-primary text-white font-semibold py-3.5 rounded-full">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { showToast, setLoading, formatNaira } from "./js/utils.js";
  import { getCustomerBasicById, getCustomerBalance } from "./js/customers.js";
  import { getCharge, updateCharge, deleteCharge } from "./js/charges.js";
  import { getPayment, updatePayment, deletePayment } from "./js/payments.js";
  import { getTag } from "./js/tags.js";
  import { deviceIcon, deviceLabel } from "./js/device-picker.js";

  await requireAuth();

  document.getElementById("back-btn").addEventListener("click", () => {
    if (window.history.length > 1) window.history.back();
    else window.location.href = "transactions.html";
  });

  const params = new URLSearchParams(window.location.search);
  const type = params.get("type");
  const id = params.get("id");
  const isCharge = type === "charge";

  if (!id || (type !== "charge" && type !== "payment")) {
    document.getElementById("load-error").classList.remove("hidden");
    throw new Error("missing or invalid type/id");
  }

  const { data: record, error } = isCharge ? await getCharge(id) : await getPayment(id);
  if (error || !record) {
    document.getElementById("load-error").classList.remove("hidden");
    throw new Error("transaction not found");
  }

  const { data: customer } = record.customer_id ? await getCustomerBasicById(record.customer_id) : { data: null };
  const { data: tag } = record.tag_id ? await getTag(record.tag_id) : { data: null };

  document.getElementById("page-title").textContent = isCharge ? "Charge" : "Payment";
  document.getElementById("type-label").textContent = isCharge ? "Charge" : "Payment received";
  document.getElementById("amount-display").textContent = formatNaira(record.amount);

  // Device summary row (charges and tag payments): "Phone x2" + amount.
  if (record.device) {
    document.getElementById("device-summary-icon").innerHTML = deviceIcon(record.device, 28);
    document.getElementById("device-summary-title").textContent = deviceLabel(record.device, record.quantity ?? 1);
    document.getElementById("device-summary-amount").textContent = formatNaira(record.amount);
    document.getElementById("device-summary").classList.remove("hidden");
    // The row carries the amount, so the big amount line is redundant here.
    document.getElementById("amount-display").classList.add("hidden");
  }
  const customerLink = document.getElementById("customer-link");
  customerLink.textContent = customer?.full_name || (tag ? `Tag ${tag.tag_no}` : "Unknown customer");
  customerLink.href = customer ? `customer-detail.html?id=${customer.id}` : "#";
  document.getElementById("created-at-display").textContent = new Date(record.created_at).toLocaleString("en-NG", {
    dateStyle: "medium",
    timeStyle: "short",
  });

  const { data: balanceRow } = record.customer_id ? await getCustomerBalance(record.customer_id) : { data: null };
  if (balanceRow && balanceRow.balance > 0) {
    document.getElementById("owing-amount").textContent = formatNaira(balanceRow.balance);
    const owingBadge = document.getElementById("owing-badge");
    owingBadge.classList.remove("hidden");
    owingBadge.classList.add("flex");
  }

  if (isCharge) {
    document.getElementById("view-duration-row").classList.remove("hidden");
    document.getElementById("view-duration").textContent = record.duration;
    document.getElementById("edit-device-field").classList.remove("hidden");
    document.getElementById("edit-duration-field").classList.remove("hidden");
  } else {
    document.getElementById("view-method-row").classList.remove("hidden");
    document.getElementById("view-method").textContent = record.method;
    document.getElementById("edit-method-field").classList.remove("hidden");
  }
  document.getElementById("view-notes").textContent = record.notes || "—";

  document.getElementById("content").classList.remove("hidden");

  // ── Edit mode ──────────────────────────────────────────────────────
  const viewMode = document.getElementById("view-mode");
  const editForm = document.getElementById("edit-form");

  function selectButton(groupSelector, value, activeClasses, idleClasses) {
    document.querySelectorAll(groupSelector).forEach((b) => {
      const isActive = b.dataset.value === value;
      b.setAttribute("aria-pressed", String(isActive));
      b.classList.remove(...activeClasses, ...idleClasses);
      b.classList.add(...(isActive ? activeClasses : idleClasses));
    });
  }

  let selectedDevice = record.device;
  let selectedDuration = record.duration;
  let selectedMethod = record.method;

  if (isCharge) {
    selectButton(".device-btn", selectedDevice,
      ["border-2", "border-blue-600", "bg-blue-50", "text-blue-600"],
      ["border", "border-slate-200", "text-slate-500"]);
    selectButton(".duration-btn", selectedDuration,
      ["sl-btn-primary", "text-white"],
      ["border", "border-slate-200", "text-slate-600"]);
  } else {
    selectButton(".method-btn", selectedMethod,
      ["border-2", "border-blue-600", "bg-blue-50", "text-blue-600"],
      ["border", "border-slate-200", "text-slate-500"]);
  }

  document.querySelectorAll(".device-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedDevice = btn.dataset.value;
      selectButton(".device-btn", selectedDevice,
        ["border-2", "border-blue-600", "bg-blue-50", "text-blue-600"],
        ["border", "border-slate-200", "text-slate-500"]);
    });
  });
  document.querySelectorAll(".duration-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.value === "Custom") {
        showToast("Coming Soon");
        return;
      }
      selectedDuration = btn.dataset.value;
      selectButton(".duration-btn", selectedDuration,
        ["sl-btn-primary", "text-white"],
        ["border", "border-slate-200", "text-slate-600"]);
    });
  });
  document.querySelectorAll(".method-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedMethod = btn.dataset.value;
      selectButton(".method-btn", selectedMethod,
        ["border-2", "border-blue-600", "bg-blue-50", "text-blue-600"],
        ["border", "border-slate-200", "text-slate-500"]);
    });
  });

  document.getElementById("edit-btn").addEventListener("click", () => {
    document.getElementById("edit-amount").value = record.amount;
    document.getElementById("edit-notes").value = record.notes || "";
    viewMode.classList.add("hidden");
    editForm.classList.remove("hidden");
  });
  document.getElementById("cancel-edit-btn").addEventListener("click", () => {
    editForm.classList.add("hidden");
    viewMode.classList.remove("hidden");
  });

  editForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector("button[type=submit]");
    const amount = Number(document.getElementById("edit-amount").value);
    const notes = document.getElementById("edit-notes").value.trim();

    const fields = isCharge
      ? { device: selectedDevice, duration: selectedDuration, amount, notes: notes || null }
      : { amount, method: selectedMethod, notes: notes || null };

    setLoading(submitBtn, true, "Saving…");
    const { error } = isCharge ? await updateCharge(id, fields) : await updatePayment(id, fields);
    setLoading(submitBtn, false);

    if (error) {
      showToast("Couldn't save changes", "error", "Please try again");
      return;
    }
    window.location.reload();
  });

  document.getElementById("delete-btn").addEventListener("click", async () => {
    const confirmed = window.confirm(`Delete this ${isCharge ? "charge" : "payment"}? This can't be undone.`);
    if (!confirmed) return;

    const { error } = isCharge ? await deleteCharge(id) : await deletePayment(id);
    if (error) {
      showToast("Couldn't delete", "error", "Please try again");
      return;
    }
    window.location.href = "transactions.html";
  });
</script>
</body>
</html>
